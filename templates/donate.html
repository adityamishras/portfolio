{% extends 'base.html' %} {% block content %}

<section
  id="donate-section"
  class="bg-gradient-to-br from-blue-100 to-purple-200 dark:from-gray-900 dark:to-gray-800 py-16 px-4 sm:px-10 transition-colors duration-300"
>
  <div
    class="max-w-6xl mx-auto bg-white dark:bg-gray-900 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 border-b-4 border-blue-500 p-8 md:p-12 lg:p-16 flex flex-col md:flex-row items-center justify-between space-y-10 md:space-y-0 md:space-x-12 transition-transform duration-300 ease-in-out transform hover:scale-[1.01]"
  >
    <!-- Left: QR Image -->
    <div class="w-full md:w-1/2 flex justify-center">
      <div class="p-4 bg-gray-50 dark:bg-gray-800 rounded-xl shadow-inner">
        <img
          src="static/images/bmc_qr.png"
          alt="Scan UPI QR Code"
          class="w-56 h-56 sm:w-64 sm:h-64 rounded-lg object-contain bg-white dark:bg-gray-100 p-2"
          onerror="this.onerror=null;this.src='https://placehold.co/300x300/CCCCCC/666666?text=UPI+QR';"
        />
      </div>
    </div>

    <!-- Right: Text Content -->
    <div class="w-full md:w-1/2 animate-fadeInSlideUp text-center md:text-left">
      <h2
        class="text-4xl sm:text-5xl font-extrabold text-gray-900 dark:text-white mb-4 leading-snug"
      >
        Buy Me a <span class="text-blue-600">Coffee</span> ☕
      </h2>

      <p
        class="text-gray-700 dark:text-gray-300 text-base sm:text-lg mb-6 leading-relaxed"
      >
        If you like my work, support me by scanning the QR code with your UPI
        app (like Google Pay, PhonePe, Paytm). Your support means a lot. Thank
        you!
      </p>

      <a
        href="#"
        class="inline-block bg-white dark:bg-gray-100 hover:bg-gray-100 dark:hover:bg-gray-200 text-blue-700 font-semibold py-3 px-6 rounded-lg shadow-md transition duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        Learn More
      </a>
    </div>
  </div>
</section>

{% endblock %}
