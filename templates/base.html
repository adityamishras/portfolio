<!DOCTYPE html>
<html lang="en" class="transition duration-800 ease-in-out">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="../static/images/favicon.png"
      type="image/x-icon"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class", // Enables class-based dark mode
      };
    </script>

    <!-- Flowbite CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <script
      src="https://kit.fontawesome.com/e362ff8530.js"
      crossorigin="anonymous"
    ></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../static/css/style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body
    class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-500 ease-in-out"
  >
    <!-- Fixed Navbar -->
    <nav
      class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200 dark:bg-gray-900 dark:border-gray-700 shadow transition-colors duration-300"
    >
      <div
        class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4"
      >
        <a href="/" class="flex items-center space-x-3 rtl:space-x-reverse">
          <img src="../static/images/favicon.png" class="h-8" alt="Logo" />
          <span
            class="self-center text-2xl font-semibold whitespace-nowrap dark:text-white"
            >Aditya Mishra</span
          >
        </a>

        <!-- Mobile Menu Button -->
        <button
          data-collapse-toggle="navbar-default"
          type="button"
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:focus:ring-gray-600"
          aria-controls="navbar-default"
          aria-expanded="false"
        >
          <span class="sr-only">Open main menu</span>
          <svg
            class="w-5 h-5"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 17 14"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M1 1h15M1 7h15M1 13h15"
            />
          </svg>
        </button>

        <!-- Nav Links -->
        <div class="hidden w-full md:block md:w-auto" id="navbar-default">
          <ul
            class="font-medium flex flex-col p-4 md:p-0 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:flex-row md:space-x-8 md:mt-0 md:border-0 md:bg-white dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700"
          >
            {% set nav_items = [ ('/', 'Home'), ('/about', 'About'),
            ('/project', 'Project'), ('/contact', 'Contact') ] %} {% for path,
            label in nav_items %}
            <li>
              <a
                href="{{ path }}"
                class="block py-2 px-4 rounded-md transition-all duration-200 {% if current_path == path %} text-white bg-blue-700 md:bg-transparent md:text-blue-700 md:dark:text-blue-500 {% else %} text-gray-900 md:text-gray-700 hover:bg-blue-100 dark:text-white dark:hover:bg-gray-700 {% endif %}"
              >
                {{ label }}
              </a>
            </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page Content (pushed down) -->
    <div class="pt-[70px]">{% block content %} {% endblock %}</div>

    <!-- Flowbite JS -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>

    <!-- Dark Mode Auto-Apply -->
    <script>
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>

    <!-- Dark Mode Toggle Support (optional checkbox-based logic) -->
    <script>
      $(function () {
        const checkbox = $("#theme-checkbox");
        if (checkbox.length) {
          // Set initial state
          checkbox.prop("checked", localStorage.getItem("theme") === "dark");

          // Toggle logic
          checkbox.change(function () {
            if ($(this).is(":checked")) {
              $("html").addClass("dark");
              localStorage.setItem("theme", "dark");
            } else {
              $("html").removeClass("dark");
              localStorage.setItem("theme", "light");
            }
          });
        }
      });
    </script>
  </body>
</html>
